let cur=0,sc=1,tx=0,ty=0,drag=0,sx=0,sy=0,travelerAnim=null;const $=id=>document.getElementById(id);
function label(t){return t==='flight'?'Air':t==='van'?'Van / Taxi':'Walk / activity'}
function tabs(){ $('tabs').innerHTML=''; D.forEach((d,i)=>{let b=document.createElement('button');b.className='tab'+(i===cur?' active':'');b.innerHTML=`Day ${i+1}<small>${d[0]}</small>`;b.onclick=()=>{cur=i;reset();render()};$('tabs').appendChild(b)})}
function focus(i){document.querySelectorAll('.card,.pin').forEach(e=>e.classList.remove('active'));document.querySelectorAll(`[data-i="${i}"]`).forEach(e=>e.classList.add('active'));let c=document.querySelector(`.card[data-i="${i}"]`);if(c&&innerWidth<881)c.scrollIntoView({behavior:'smooth',block:'center'})}
function render(){tabs();let d=D[cur],S=d[7];$('title').textContent=`Day ${cur+1} · ${d[2]}`;$('meta').textContent=`${d[0]} · ${d[1]} travelers`;$('party').textContent=`${d[1]} travelers`;$('mapTitle').textContent=d[3];$('stats').textContent=d[4];$('bg').style.backgroundImage=`url('${A[d[5]]}')`;$('sun').hidden=!d[6];$('balloon').hidden=!d[6];$('cards').innerHTML='';$('pins').innerHTML='';$('routes').innerHTML='';S.forEach((s,i)=>{let c=document.createElement('div');c.className='card';c.dataset.i=i;let ch=s[6]==='choice'?s[2].split(' / ').map(x=>`<span class="choice">${x}</span>`).join(''):'';c.innerHTML=`<div class="time">${s[0]}</div><h3>${s[1]}</h3><p>${s[6]==='choice'?'Pick one option for this window.':s[2]}</p>${ch}<span class="t">${label(s[3])}</span>`;c.onclick=()=>focus(i);$('cards').appendChild(c);if(!d[8]){let p=document.createElement('button');p.className='pin';p.dataset.i=i;p.textContent=i+1;p.style.left=s[4]+'%';p.style.top=s[5]+'%';p.onclick=e=>{e.stopPropagation();focus(i)};$('pins').appendChild(p);if(i&&s[6]!=='branch'){let a=S[i-1],l=document.createElementNS('http://www.w3.org/2000/svg','line');[['x1',a[4]],['y1',a[5]],['x2',s[4]],['y2',s[5]]].forEach(x=>l.setAttribute(...x));l.setAttribute('class','rl '+s[3]);$('routes').appendChild(l)}}});let f=S[0],l=S[S.length-1];$('guide').style.left=Math.min(84,l[4]+6)+'%';$('guide').style.top=Math.max(15,l[5]-12)+'%';$('camera').style.left=Math.max(12,(f[4]+l[4])/2-3)+'%';$('camera').style.top=Math.min(78,(f[5]+l[5])/2+13)+'%';animateTraveler(d,S)}
function animateTraveler(d,S){
 const t=$('traveler');
 if(travelerAnim){travelerAnim.cancel();travelerAnim=null}
 if(d[8]||!S.length){t.style.display='none';return}
 t.style.display='block';
 const pts=S.filter(x=>x[6]!=='branch').map(x=>({x:x[4],y:x[5]}));
 t.style.left=pts[0].x+'%';t.style.top=pts[0].y+'%';
 if(pts.length<2||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const frames=pts.map((pt,i)=>({left:pt.x+'%',top:pt.y+'%',offset:i/(pts.length-1)}));
 travelerAnim=t.animate(frames,{duration:Math.max(18000,pts.length*4500),iterations:Infinity,direction:'alternate',easing:'linear'});
}
function apply(){$('view').style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}function reset(){sc=1;tx=ty=0;apply()}$('plus').onclick=()=>{sc=Math.min(2.2,sc+.18);apply()};$('minus').onclick=()=>{sc=Math.max(.75,sc-.18);apply()};$('reset').onclick=reset;$('map').onpointerdown=e=>{if(e.target.closest('.pin,.ctrl'))return;drag=1;sx=e.clientX-tx;sy=e.clientY-ty;$('map').setPointerCapture(e.pointerId)};$('map').onpointermove=e=>{if(!drag)return;tx=e.clientX-sx;ty=e.clientY-sy;apply()};$('map').onpointerup=()=>drag=0;$('map').onpointercancel=()=>drag=0;$('map').addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.2,Math.max(.75,sc+(e.deltaY<0?.12:-.12)));apply()},{passive:false});render();
